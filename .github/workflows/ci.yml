name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # the release workflow runs the same tests first

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install conversion tools
        timeout-minutes: 12
        run: |
          # man-db rebuilds its index after every install and can stall the runner for ages
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils ghostscript imagemagick ffmpeg pandoc librsvg2-2 \
            desktop-file-utils appstream libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e '.[gui,dev]'
      - name: Lint
        run: ruff check .
      - name: Versions and generated assets are in sync
        run: python packaging/build.py check
      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
