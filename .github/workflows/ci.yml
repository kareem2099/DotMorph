name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # the release workflow runs the same tests first

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The .deb files are cached: the Ubuntu mirror is sometimes very slow (a few KB/s), and
      # ffmpeg + ImageMagick pull ~150 MB. With a cache hit nothing big is downloaded.
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install conversion tools
        timeout-minutes: 15
        run: |
          # man-db rebuilds its index after every install and can stall the runner for ages
          sudo rm -f /var/lib/man-db/auto-update
          # a stalled mirror download is dropped after 30 s and retried (applies to every apt call)
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null
          sudo apt-get update
          mkdir -p ~/apt-cache/partial
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" poppler-utils ghostscript imagemagick ffmpeg pandoc librsvg2-2 \
            desktop-file-utils appstream libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache   # so actions/cache can save it
          rm -rf ~/apt-cache/partial ~/apt-cache/lock
          du -sh ~/apt-cache
      - name: Install
        run: pip install -e '.[gui,dev]'
      - name: Lint
        run: ruff check .
      - name: Versions and generated assets are in sync
        run: python packaging/build.py check
      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
