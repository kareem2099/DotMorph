<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- DotMorph, in the DotSuite style: emerald neon on near-black -->
  <defs>
    <radialGradient id="badge" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1b2422"/>
      <stop offset="1" stop-color="#0a0d0c"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#badge)"/>
  <circle cx="128" cy="128" r="114" fill="none" stroke="#10B981" stroke-opacity="0.22" stroke-width="2"/>

  <!-- the wheel: five sectors, one lit -->
  <g fill="none" stroke-width="22" stroke-linecap="round" filter="url(#glow)">
    <path d="M128 52 A76 76 0 0 1 199.3 101.7" stroke="#6EE7B7"/>
    <path d="M203.4 125.6 A76 76 0 0 1 172.6 189.5" stroke="#10B981"/>
    <path d="M150.2 200.7 A76 76 0 0 1 103.4 199.9" stroke="#10B981" stroke-opacity="0.75"/>
    <path d="M81.6 187.8 A76 76 0 0 1 52.9 121.3" stroke="#10B981" stroke-opacity="0.6"/>
    <path d="M58.6 98.5 A76 76 0 0 1 105.5 55.4" stroke="#10B981" stroke-opacity="0.45"/>
  </g>

  <!-- the hub: a DotSuite node -->
  <circle cx="128" cy="128" r="26" fill="#10B981" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="10" fill="#ECFDF5"/>
</svg>
